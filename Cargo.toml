[package]
name = "alice-wm"
version = "0.1.0"
edition = "2024"

[dependencies]
tracing-subscriber = { version = "0.3.16", features = ["env-filter"] }
bitflags = "2.13.1"

[dependencies.smithay]
version = "0.7.0"
default-features = false
features = [
    "backend_winit",
    "wayland_frontend",
    "desktop"
]

[dependencies.mlua]
version = "0.12.0"
features = [
    "vendored",
    "lua55",
]
